[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-atelie-grpc"
version = "1.0.0"
description = "Demonstração acadêmica de contratos Protocol Buffers, regras de negócio e comunicação gRPC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "grpcio==1.84.0",
  "protobuf>=6.31.1,<8",
]

[project.optional-dependencies]
dev = ["grpcio-tools==1.84.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
